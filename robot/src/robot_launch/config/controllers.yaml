controller_manager:
    ros__parameters:
        update_rate: 100
        joint_state_broadcaster:
            type: joint_state_broadcaster/JointStateBroadcaster
        diff_drive_controller:
            type: diff_drive_controller/DiffDriveController
        excavation_controller:
            type: forward_command_controller/ForwardCommandController
        deposition_controller:
            type: forward_command_controller/ForwardCommandController

diff_drive_controller:
    ros__parameters:
        left_wheel_names: ["front_left_wheel_joint", "rear_left_wheel_joint"]
        right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]
        wheel_separation: 0.381 # 15 in
        wheel_radius: 0.1016 # 4 in
        wheel_separation_multiplier: 1.0 # skid steer: tune from a spin-in-place test
        cmd_vel_timeout: 0.5 # zero output if cmd_vel stops
        use_stamped_vel: false # plain geometry_msgs/Twist (Jazzy default is stamped)
        open_loop: false # odometry from measured wheel feedback
        base_frame_id: base_link
        odom_frame_id: odom
        enable_odom_tf: true

# One command array per subsystem; element order follows `joints`.
excavation_controller:
    ros__parameters:
        joints:
            [
                "bucket_joint",
                "linear_actuator_left_joint",
                "linear_actuator_right_joint",
            ]
        interface_name: duty_cycle

deposition_controller:
    ros__parameters:
        joints: ["deposition_joint"]
        interface_name: duty_cycle
