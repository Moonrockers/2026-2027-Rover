controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
    excavation_controller:
      type: forward_command_controller/ForwardCommandController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["front_left_wheel_joint", "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]
    wheel_separation: 0.5      # set from your CAD
    wheel_radius: 0.1          # set from your CAD
    cmd_vel_timeout: 0.5       # zero output if cmd_vel stops
    use_stamped_vel: false     # Jazzy default is TwistStamped
    open_loop: false           # odometry from measured wheel feedback

excavation_controller:
  ros__parameters:
    joints: ["bucket_joint"]
    interface_name: duty_cycle
